$schema: https://json-schema.org/draft/2020-12/schema
title: Detection card
type: object
additionalProperties: false
required: [id, title, version, status, tactics, techniques, platforms, datasources, detections]
properties:
  id:
    type: string
    pattern: '^DET-[A-Z0-9]+(?:-[A-Z0-9]+)+$'
  title:
    $ref: '#/$defs/nonemptyString'
  version:
    type: string
    pattern: '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$'
  status:
    enum: [draft, test, stable, deprecated]
  tactics:
    $ref: '#/$defs/nonemptyStringList'
  techniques:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: '^T\d{4}(?:\.\d{3})?$'
  platforms:
    $ref: '#/$defs/nonemptyStringList'
  datasources:
    $ref: '#/$defs/nonemptyStringList'
  severity:
    enum: [informational, low, medium, high, critical]
  confidence:
    enum: [low, medium, high]
  detections:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      sigma:
        $ref: '#/$defs/stringList'
      network_rules:
        $ref: '#/$defs/stringList'
      yara:
        $ref: '#/$defs/stringList'
      hunts:
        $ref: '#/$defs/stringList'
      queries:
        type: object
        propertyNames:
          $ref: '#/$defs/nonemptyString'
        additionalProperties:
          $ref: '#/$defs/stringList'
  tests:
    type: object
    additionalProperties: false
    properties:
      atomic:
        $ref: '#/$defs/stringList'
      datasets:
        $ref: '#/$defs/stringList'
  validation:
    type: object
    additionalProperties: false
    required: [status]
    properties:
      status:
        enum: [not_tested, tested, partial]
      tpr:
        $ref: '#/$defs/rate'
      fpr:
        $ref: '#/$defs/rate'
      latency_ms:
        type: [number, 'null']
        minimum: 0
      notes:
        type: string
  tuning:
    type: object
    additionalProperties: false
    properties:
      fp_sources:
        $ref: '#/$defs/stringList'
      allowlists:
        $ref: '#/$defs/stringList'
      notes:
        type: string
  references:
    $ref: '#/$defs/stringList'
  authors:
    $ref: '#/$defs/stringList'
  changelog:
    $ref: '#/$defs/stringList'
$defs:
  nonemptyString:
    type: string
    minLength: 1
    pattern: '\S'
  stringList:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/nonemptyString'
  nonemptyStringList:
    allOf:
      - $ref: '#/$defs/stringList'
      - minItems: 1
  rate:
    type: [number, 'null']
    minimum: 0
    maximum: 1
