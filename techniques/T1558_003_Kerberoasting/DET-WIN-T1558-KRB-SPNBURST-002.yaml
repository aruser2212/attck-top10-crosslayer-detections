validation:
  status: partial
  tpr: null
  fpr: null
  latency_ms: null
  notes: >-
    Synthetic XML 4769 versions 0/2 and manually specified rolling fixtures cover
    requester/domain/IP identity, successful RC4, exact distinct service SID counts,
    timestamp boundaries, repeats and missing fields. The kerberos-v1 profile and
    finite Elasticsearch Basic replay use PIT/search_after and Python rolling evaluation.
    A legitimate application burst is an expected candidate match, not attack ground truth.
    ServiceName is account context, not a complete SPN. No continuous 4769 pipeline,
    real collector integration, calibrated threshold or operational TPR/FPR/latency is claimed.
tuning:
  fp_sources:
  - legacy applications requesting RC4 tickets for several service accounts
  - legitimate administration and application startup
  allowlists: []
  notes: >-
    Candidate threshold: >=5 service SIDs in (t-5m,t] for exact requester/domain/IP.
    Do not suppress machine accounts or app/iis/svc prefixes globally. Tune only
    with representative benign telemetry and reviewed account/service context.
    AES tickets and slower activity are outside this rule; missing requester/domain/IP
    or service SID excludes the event from both metrics. Alias resolution is not inferred.
