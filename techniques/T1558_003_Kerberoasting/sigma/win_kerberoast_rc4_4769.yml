title: Successful Kerberos TGS Request with RC4 (Candidate)
id: 0a8594e9-a8bc-4c38-9ff5-3d7d03d2c6d8
status: test
description: >-
  Selects successful Kerberos TGS requests using RC4 (0x17) for investigation.
  Legacy clients and services legitimately use RC4; this selector alone does
  not prove Kerberoasting and does not suppress machine accounts by name.
tags:
- attack.t1558.003
- attack.credential-access
logsource:
  product: windows
  service: security
detection:
  sel:
    EventID: 4769
    Status: '0x0'
  rc4_a:
    TicketEncryptionType: '0x17'
  rc4_b:
    TicketEncryptionType|contains: RC4
  condition: sel and (rc4_a or rc4_b)
level: medium
fields:
- TargetDomainName
- TargetUserName
- IpAddress
- ServiceName
- TicketEncryptionType
- Status
falsepositives:
- Application servers legitimately requesting RC4 tickets in legacy realms
