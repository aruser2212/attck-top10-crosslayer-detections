validation:
  status: partial
  tpr: null
  fpr: null
  latency_ms: null
  notes: Sigma remains a broad LT9/seclogo selector. The dedicated newcredentials-v1 runtime joins
    4624 TargetLogonId/TargetUserSid to 4672 SubjectLogonId/SubjectUserSid under the same host and
    explicitly supplied trusted boot scope, with a bounded symmetric record-time tolerance. Strict
    XML normalization supports 4624 versions 0/2 and 4672 version 0; finite offline and Elasticsearch
    Basic replay use linked source evidence and reject ambiguous participating sessions. Executed
    checks are recorded in docs/validation_report.md. Generic Hunt/first-seen execution and
    Sigma/backend parity are not claimed. Live collection, boot-scope provenance and operational
    TPR/FPR/latency remain unverified.
tuning:
  fp_sources:
  - runas /netonly в админ-процессах
  allowlists: []
  notes: LT9/seclogo and same-session special privileges identify a candidate, not proof of PtH.
    Legitimate runas /netonly can match. Do not substitute account names, IP proximity or a time-only
    grouping for host/boot/LogonId and local-token SID identity. Severity medium and confidence low
    reflect investigation priority without an unmeasured maliciousness claim; no blanket allowlist.
