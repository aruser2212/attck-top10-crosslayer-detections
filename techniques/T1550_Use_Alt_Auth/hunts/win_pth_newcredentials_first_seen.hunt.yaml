dataset: windows.security.sessions
where:
  all:
  - field: event.code
    op: eq
    value: '4624'
  - field: win.logon_type
    op: eq
    value: 9
  - field: win.logon_process
    op: eq
    value: seclogo
first_seen:
  key:
  - host.name
  - user.id
  horizon: 30d
project:
- '@timestamp'
- host.name
- host.boot.id
- session.id
- user.id
- win.logon_type
- win.logon_process
notes: >-
  Legacy design-only idea for historical context; first_seen is not implemented by the generic
  Hunt engines or the dedicated NewCredentials correlation. user.id denotes the local token SID,
  not outbound network credentials. A new host/SID combination can result from legitimate
  administration, a cold baseline or missing history and does not establish PtH. A 30-day horizon
  is a proposed context policy, not a calibrated threshold. A unique LogonId or newly supplied
  boot label must not be used to declare every session unusual. The executable finite pilot
  links same-session 4624/4672 evidence without novelty suppression; see docs/newcredentials.md.
