title: NewCredentials Logon Candidate (LT=9) via seclogo
id: 37370eb0-f878-4495-9772-be20d61c9cbe
status: test
description: >-
  Selects successful LogonType 9 NewCredentials logons via seclogo for investigation.
  Legitimate runas /netonly can match; the event alone does not prove Pass-the-Hash.
  This broad selector does not require 4672, session joining or trusted boot scope.
  The separate finite newcredentials-v1 correlation has its own stricter contract.
tags:
- attack.t1550
- attack.lateral-movement
logsource:
  product: windows
  service: security
detection:
  sel:
    EventID: 4624
    LogonType: 9
  seclogo:
    LogonProcessName: seclogo
  condition: sel and seclogo
level: medium
fields:
- IpAddress
- SubjectUserName
- LogonProcessName
- AuthenticationPackageName
falsepositives:
- runas /netonly
