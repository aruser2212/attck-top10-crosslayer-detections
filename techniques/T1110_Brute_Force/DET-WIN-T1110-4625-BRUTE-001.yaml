  notes: Native pySigma parsing and source-scoped synthetic predicate fixtures passed; no backend equivalence
    claimed for these Sigma rules. Hunt v1 T1110 thresholds replayed in fixed UTC tumbling windows; boundary-spanning
    bursts can be missed. Both Windows hunts replayed on Elasticsearch Basic 8.19.4, including XML normalization,
    exact distinct counts and full pagination. Templates require tools/elastic_adapter.py for PIT, pagination
    and alert thresholds. Controlled-spool ingestion, closed-window scheduling, bounded late-event replay
    and SQLite/outbox recovery are tested on Elasticsearch Basic. Production collector deployment, unrestricted
    lateness, production tuning and operational TPR/FPR/latency remain unmeasured. Separate rolling v2
    evaluates exact event-anchored (t-W,t] windows with atomic timestamp ties and preceding
    context. Its auth-v2/date_nanos adapter retrieves events through PIT/search_after for Python evaluation;
    a dedicated durable v2 pipeline stores microsecond checkpoints and versioned alert updates,
    retractions and outbox recovery without migrating v1 state. Each qualifying group/timestamp yields a result,
    preserved as raw evidence. An optional downstream episode view groups anchors by exact rule/group
    and inactivity gap, retains member IDs/revisions and peak window metrics, and revises merge/split
    and retraction results without summing overlapping counts. Incremental group updates are checked
    against full reconstruction; verified evidence export preserves live history and validates current
    episode membership against the full reference calculation. Synthetic contracts, recovery tests and
    an independent rolling oracle are the evidence scope; production false-positive rates are not inferred.
