schema_version: 1
dataset: windows.security.logons
where:
  all:
    - { field: event.code, op: eq, value: "4625" }
aggregate:
  group_by: [target.user, source.ip]
  window: 5m
  window_type: tumbling
  metrics:
    - { name: fails, fn: count, field: "*" }
having:
  - { field: fails, op: gte, value: 10 }
project: [window.start, window.end, source.ip, target.user, fails]
notes: "Brute: >=10 ошибок по account×IP в фиксированном UTC-окне [start,end) 5 минут. Окна не скользящие; серия на границе может не достичь порога."
