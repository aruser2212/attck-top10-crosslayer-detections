schema_version: 2
dataset: linux.auth.sshd
where:
  all:
  - field: message
    op: contains
    value: Failed password
aggregate:
  group_by:
  - source.ip
  - user.name
  window: 5m
  window_type: rolling
  metrics:
  - name: fails
    fn: count
    field: '*'
having:
- field: fails
  op: gte
  value: 8
project:
- window.start
- window.end
- source.ip
- user.name
- fails
notes: 'SSH brute: >=8 Failed password по user×IP в скользящем окне (t-5m,t] на каждой метке подходящего
  события. Равновременные события учитываются вместе. Отдельный finite replay v2; подавления повторных
  алертов по эпизоду нет.'
