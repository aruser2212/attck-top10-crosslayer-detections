schema_version: 2
dataset: windows.security.logons
where:
  all:
  - field: event.code
    op: eq
    value: '4625'
aggregate:
  group_by:
  - source.ip
  window: 10m
  window_type: rolling
  metrics:
  - name: distinct_users
    fn: count_distinct
    field: target.user
having:
- field: distinct_users
  op: gte
  value: 15
project:
- window.start
- window.end
- source.ip
- distinct_users
notes: 'Spray: >=15 различных target.user с одного IP в скользящем окне (t-10m,t] на каждой метке подходящего
  события. Равновременные события учитываются вместе. Replay и отдельный durable pipeline v2; подавления повторных
  алертов по эпизоду нет.'
