title: Shadow Copies Deletion Tools Usage
id: 88476f58-847a-4add-bc53-b84ac9c25b97
status: test
description: >-
  Detects explicit shadow-copy deletion arguments in vssadmin, wmic or
  PowerShell. Enumeration commands and diskshadow script invocation alone
  are insufficient; contents of external scripts are outside this rule.
tags:
- attack.t1490
- attack.impact
logsource:
  product: windows
  category: process_creation
detection:
  vssadmin:
    Image|endswith: \vssadmin.exe
    CommandLine|contains: ' delete shadows'
  wmic:
    Image|endswith: \wmic.exe
    CommandLine|contains|all:
    - shadowcopy
    - delete
  powershell_image:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
  powershell_target:
    CommandLine|contains: Win32_ShadowCopy
  powershell_delete:
    CommandLine|contains:
    - .Delete(
    - Remove-WmiObject
    - Remove-CimInstance
  condition: vssadmin or wmic or (powershell_image and powershell_target and powershell_delete)
level: high
fields:
- Image
- CommandLine
- User
- ParentImage
falsepositives:
- backup/restore scripts
