dataset: windows.process.creation
where:
  any:
  - all:
    - field: process.name
      op: eq
      value: vssadmin.exe
    - field: process.command_line
      op: contains
      value: ' delete shadows'
  - all:
    - field: process.name
      op: eq
      value: wmic.exe
    - field: process.command_line
      op: contains
      value: shadowcopy
    - field: process.command_line
      op: contains
      value: delete
  - all:
    - field: process.name
      op: in
      value:
      - powershell.exe
      - pwsh.exe
    - field: process.command_line
      op: contains
      value: Win32_ShadowCopy
    - any:
      - field: process.command_line
        op: contains
        value: .Delete(
      - field: process.command_line
        op: contains
        value: Remove-WmiObject
      - field: process.command_line
        op: contains
        value: Remove-CimInstance
project:
- '@timestamp'
- host.name
- user.name
- parent.image
- process.command_line
notes: 'Legacy design-only hunt: исполняемого адаптера нет, эквивалентность Sigma не проверена. T1490:
  явные аргументы удаления VSS. Перечисление теневых копий и запуск diskshadow-скрипта сами по себе не
  подходят. Windows image/command matching требует нечувствительности к регистру; external script contents
  вне покрытия.'
