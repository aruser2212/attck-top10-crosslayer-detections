dataset: linux.auditd.exec
where:
  all:
  - any:
    - field: process.command_line
      op: contains
      value: /var/log/
    - field: process.command_line
      op: endswith
      value: ' /var/log'
  - any:
    - any:
      - field: process.executable
        op: endswith
        value: /rm
      - field: process.executable
        op: endswith
        value: /shred
    - all:
      - field: process.executable
        op: endswith
        value: /truncate
      - any:
        - field: process.command_line
          op: contains
          value: ' -s 0 '
        - field: process.command_line
          op: contains
          value: ' --size=0 '
        - field: process.command_line
          op: contains
          value: ' --size 0 '
project:
- '@timestamp'
- host.name
- user.name
- process.executable
- process.command_line
notes: 'Legacy design-only hunt: исполняемого адаптера нет, эквивалентность Sigma не проверена. Кандидат
  процесса удаления/обнуления /var/log, не доказательство успешного изменения. Требуются joined SYSCALL/EXECVE:
  exe→process.executable, реконструкция arguments→process.command_line; Linux matching case-sensitive.
  Shell builtins history -c и echo не наблюдаются как отдельные EXECVE и исключены из scope.'
