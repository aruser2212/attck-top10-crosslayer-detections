dataset: windows.sysmon.process_access
where:
  all:
  - field: event.code
    op: eq
    value: '10'
  - field: target.image
    op: endswith
    value: \lsass.exe
project:
- '@timestamp'
- host.name
- user.name
- source.image
- target.image
notes: 'Legacy design-only hunt: исполняемого адаптера нет, эквивалентность Sigma не проверена. Кандидат
  ProcessAccess, не доказательство дампа. Нет исключений по basename; доверенные AV/EDR требуют профиля
  пути/подписи. Windows image matching должен учитывать регистр как Sigma.'
