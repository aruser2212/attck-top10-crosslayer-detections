title: Broad LSASS Process Access Candidate (Sysmon 10)
id: 0364c0b3-5f83-4735-8d83-9e815adba922
status: test
description: >-
  Broad selector for Sysmon ProcessAccess events targeting an image named lsass.exe.
  It does not require PROCESS_VM_READ or process GUIDs and can match query-only access.
  The separate lsass-v1 runtime applies a stricter bitmask/identity contract; equivalence
  is not claimed. Access alone does not prove memory reading, credential dumping or
  target authenticity. No global basename exclusions are applied: trusted AV/EDR tuning
  requires a deployment-specific profile.
references:
- https://learn.microsoft.com/sysinternals/downloads/sysmon
tags:
- attack.t1003.001
- attack.credential-access
logsource:
  product: windows
  service: sysmon
  category: process_access
detection:
  sel:
    EventID: 10
    TargetImage|endswith: \lsass.exe
  condition: sel
level: medium
fields:
- TargetImage
- SourceImage
- SourceProcessGUID
- TargetProcessGUID
- GrantedAccess
- CallTrace
falsepositives:
- AV/EDR self-protection
- legitimate diagnostic and authentication software
