title: LSASS Process Access Candidate (Sysmon 10)
id: 0364c0b3-5f83-4735-8d83-9e815adba922
status: test
description: >-
  Selects Sysmon ProcessAccess events targeting lsass.exe for investigation.
  Access alone does not prove credential dumping. No global basename exclusions
  are applied: trusted AV/EDR tuning requires a deployment-specific profile.
references:
- https://learn.microsoft.com/sysinternals/downloads/sysmon
tags:
- attack.t1003.001
- attack.credential-access
logsource:
  product: windows
  service: sysmon
  category: process_access
detection:
  sel:
    EventID: 10
    TargetImage|endswith: \lsass.exe
  condition: sel
level: medium
fields:
- TargetImage
- SourceImage
- SourceProcessGUID
- TargetProcessGUID
- GrantedAccess
- CallTrace
falsepositives:
- AV/EDR self-protection
- legitimate diagnostic and authentication software
