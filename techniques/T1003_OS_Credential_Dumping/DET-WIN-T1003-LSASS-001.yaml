  notes: Sigma remains a broad Sysmon 10 target-name selector. The separate lsass-v1 runtime requires
    GrantedAccess bit 0x10 and host-scoped source/target ProcessGUIDs, with strict Sysmon version 3 XML
    normalization and finite Elasticsearch Basic replay. Synthetic fixtures distinguish noncandidates,
    legitimate candidates and invalid input; executed checks are recorded in docs/validation_report.md.
    Sigma/backend parity and generic Hunt execution are not claimed. Live collection, target-process
    authenticity, actual memory reading/dumping and operational TPR/FPR/latency remain unverified.
tuning:
  fp_sources:
  - Legitimate AV/EDR and diagnostic software granted PROCESS_VM_READ
  - Other executables named lsass.exe; basename does not attest Windows LSASS
  allowlists: []
  notes: Granted PROCESS_VM_READ is a candidate, not proof of memory reading or dumping. No source-basename
    exclusions apply. Verify real AV/EDR profiles with source-specific path, signature, hash and identity
    evidence before introducing tuning; synthetic benign matches do not establish that trust.
