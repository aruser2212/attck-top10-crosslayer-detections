dataset: windows.process.creation
where:
  all:
    - any:
        - { field: parent.image, op: endswith, value: '\WINWORD.EXE' }
        - { field: parent.image, op: endswith, value: '\EXCEL.EXE' }
        - { field: parent.image, op: endswith, value: '\POWERPNT.EXE' }
        - { field: parent.image, op: endswith, value: '\OUTLOOK.EXE' }
    - { field: process.name, op: in, value: ["powershell.exe","wscript.exe","cscript.exe","mshta.exe","cmd.exe"] }
    - any:
        - { field: process.command_line, op: contains, value: " -enc " }
        - { field: process.command_line, op: contains, value: " -e " }
        - { field: process.command_line, op: contains, value: "http://" }
        - { field: process.command_line, op: contains, value: "https://" }
first_seen:
  key: [parent.image, process.name]
  horizon: 30d
project: ["@timestamp", host.name, user.name, parent.image, process.name, process.command_line]
notes: "Parent AND child AND command indicator согласованы с Sigma; Windows-пути требуют нечувствительности к регистру в адаптере. First-seen — контекст, не подавление алертов. Legacy hunt: v1 не поддерживает first_seen."
