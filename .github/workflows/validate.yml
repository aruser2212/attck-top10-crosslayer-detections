name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure-and-predicates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: make check PYTHON=python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structural-and-predicate-evidence
          path: artifacts/

  suricata-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: make check-network PYTHON=python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suricata-replay-evidence
          path: artifacts/

  elastic-basic-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: make lab-up
      - run: make check-elastic PYTHON=python
      - name: Capture service logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/elastic.log
      - run: make lab-down
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elastic-basic-evidence
          path: artifacts/
